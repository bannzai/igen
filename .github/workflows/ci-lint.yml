# managed-by: setup-ci (bannzai/castle)
name: Swift の lint

on:
  pull_request:
    paths:
      - 'ios/**/*.swift'
      - '.swift-format'
      - '.github/workflows/ci-lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: フォーマッターのバージョンを確認する
        run: xcrun swift-format --version
      - name: Swift の lint を実行する
        run: xcrun swift-format lint --strict --recursive ios
