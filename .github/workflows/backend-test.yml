# backend/ (Firebase Functions) の PR チェック。実行コマンドは CLAUDE.md の「バックエンド」検証方法と一致させる。
# iOS 側の CI は用意しない (private リポジトリの macOS ランナーは高額なため、ローカルの xcodebuild 検証のみ)。
name: Backend Tests

on:
  pull_request:
    paths:
      # workflow 自身の変更ではトリガーしない (backend/ が存在しない PR で必ず失敗するため)。
      # workflow を変更する PR では backend/ 側にも変更を入れて CI を通すこと。
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      # Firestore Emulator の実行に Java が必要
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci
        working-directory: backend/functions

      - name: Lint (Biome)
        run: npm run lint
        working-directory: backend/functions

      - name: Build (tsc)
        run: npm run build
        working-directory: backend/functions

      - name: Test (Vitest on Firestore Emulator)
        run: npm test
        working-directory: backend/functions
