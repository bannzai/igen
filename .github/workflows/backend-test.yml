# backend/ (Firebase Functions) の PR チェック。実行コマンドは CLAUDE.md の「バックエンド」検証方法と一致させる。
name: Backend Tests

on:
  pull_request:
    paths:
      # workflow 自身の変更ではトリガーしない (backend/ が存在しない PR で必ず失敗するため)。
      # workflow を変更する PR では backend/ 側にも変更を入れて CI を通すこと。
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      # Firestore Emulator の実行に Java が必要
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci
        working-directory: backend/functions

      - name: Lint (Biome)
        run: npm run lint
        working-directory: backend/functions

      - name: Build (tsc)
        run: npm run build
        working-directory: backend/functions

      - name: Test (Vitest on Firestore Emulator)
        run: npm test
        working-directory: backend/functions
