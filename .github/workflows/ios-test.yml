# ios/ の PR チェック。実行コマンドは CLAUDE.md の「iOS」検証方法と一致させる。
# IgenTests と IgenUITests の両方を回す (public リポジトリで macOS Runner が無料のため、実行時間より検出範囲を優先する)。
# AppStoreScreenshot*PageSnapshotUITest だけは除外する。これらは検証ではなく scripts/generate_screenshots が
# ストア用スクリーンショットを撮るための生成ツールで、CI で回しても成果物が捨てられるだけのため。
name: iOS Tests

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-test.yml'

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # RevenueCat の public API key は gitignore された ios/Config.local.xcconfig 運用のため checkout に存在しない。
      # 未登録でも空値のまま生成してビルドは通す（キーが空なら実行時に SDK の初期化をスキップする）
      - name: Config.local.xcconfig を Secrets から生成する
        env:
          REVENUECAT_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_PUBLIC_API_KEY_IOS }}
        run: printf 'REVENUECAT_PUBLIC_API_KEY = %s\n' "$REVENUECAT_PUBLIC_API_KEY" > ios/Config.local.xcconfig

      # -skipPackagePluginValidation: LicenseList の build tool plugin は GUI で一度許可するまで CLI から実行できない（Makefile 参照）
      # CODE_SIGN_IDENTITY=-: runner に証明書が無い。無署名 (CODE_SIGNING_ALLOWED=NO) にすると application-identifier entitlement が
      # 付かず Simulator の Keychain が使えなくなり、Firebase Auth のサインインが失敗する（PR #53）
      - name: テストを実行する
        run: |
          mkdir -p tmp
          xcodebuild test \
            -project ios/Igen.xcodeproj \
            -scheme Igen \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath tmp/DerivedData \
            -resultBundlePath tmp/IgenTests.xcresult \
            -skip-testing:IgenUITests/AppStoreScreenshot1PageSnapshotUITest \
            -skip-testing:IgenUITests/AppStoreScreenshot2PageSnapshotUITest \
            -skip-testing:IgenUITests/AppStoreScreenshot3PageSnapshotUITest \
            -skip-testing:IgenUITests/AppStoreScreenshot4PageSnapshotUITest \
            -skip-testing:IgenUITests/AppStoreScreenshot5PageSnapshotUITest \
            -skip-testing:IgenUITests/AppStoreScreenshot6PageSnapshotUITest \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            > tmp/ios-test.log 2>&1 || {
            echo "テストに失敗。ログ末尾:" >&2
            tail -n 200 tmp/ios-test.log >&2
            exit 1
          }
          # XCTest は「Test Suite ... passed」、Swift Testing は「✔ Test run with N tests ...」と別形式で出す
          grep -E "^Test Suite 'All tests' (passed|failed)|Test run with .* (passed|failed)" tmp/ios-test.log | tail -n 5

      # 失敗時の切り分け用。ログ全文と xcresult（UITests のスクリーンショット添付を含む）を残す
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ios-test-log
          path: tmp/ios-test.log
          retention-days: 7

      # xcresult はそのままだと数百 MB になりダウンロードが現実的でないため、
      # UITests が添付したスクリーンショットだけを取り出して artifact にする
      - name: スクリーンショットを取り出す
        if: always()
        run: |
          mkdir -p tmp/attachments
          xcrun xcresulttool export attachments \
            --path tmp/IgenTests.xcresult \
            --output-path tmp/attachments || echo "添付の取り出しに失敗（テストが添付を残していない場合もある）"
          ls -la tmp/attachments || true

      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ios-test-attachments
          path: tmp/attachments
          retention-days: 7
          if-no-files-found: ignore
